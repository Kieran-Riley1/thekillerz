<!DOCTYPE html>
<html lang="en" manifest="app.appcache">

    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>The Killerz - The UK's No 1 Tribute to The Killers</title>
        <meta name="robots" content="index"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="The Killerz - The UK's No 1 Tribute to The Killers" />
        <meta name="keywords" content="killerz, killers, thekillerz, thekillers, kopycat, kopycats, the kopycat killers, kopycat killers, fillers, the fillers, tribute, killers tribute, tribute band, the killerz, copycat, killers band, function band, wedding band, festival, for hire, tribute band uk, uk band, fake festival, tribfest, top tribute bands, fillers band, tribute singers, party band, world leading, tour, upcoming dates, gigs, agency band, hire, band hire, band promo, promo video, tribute acts management, the victims, victims" />
        <meta name="author" content="The Killerz - The UK's No 1 Tribute to The Killers" />
        <link rel="shortcut icon" href="images/kz.ico">
        <link rel="stylesheet" type="text/css" href="krstyle.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="./lightbox/lightbox.min.css">


    </head>

    <body>
        <div class="loader-wrapper">
            <img class="loader-image" width="20%" src="images/loader.gif">
            <h1 class="loading-animation">LOADING</h1>
        </div>

        <header class="header">
            <div class="container">
                <div class="nav">
                    <a href="krindex.css" class="logo">
                        <img id="logo" src="images/logo.png">
                    </a>
                    <div class="span">
                        <i class="fa fa-bars"></i>
                        <i class="fa fa-times"></i>
                    </div>
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="#home" class="nav-link" id="nav-btn">HOME</a>
                        </li>
                        <li class="nav-item">
                            <a href="#tour" class="nav-link" id="nav-btn">TOUR</a>
                        </li>
                        <li class="nav-item">
                            <a href="#gallery" class="nav-link" id="nav-btn">GALLERY</a>
                        </li>
                        <li class="nav-item">
                            <a href="#about" class="nav-link" id="nav-btn">ABOUT</a>
                        </li>
                        <li class="nav-item">
                            <a href="#band" class="nav-link" id="nav-btn">BAND</a>
                        </li>
                        <li class="nav-item">
                            <a href="#contact" class="nav-link" id="nav-btn">CONTACT</a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <main id="home">

            <div class="container-form" id="contact">
                <h5 class="section-head">
                    <span class="heading">CONTACT US</span><br>
                    <span class="subheading">For further information about a gig please use the mail form below. <br> Or email us at:<br><br>
                        <a href="mailto:info@thekillerz.co.uk?Subject=The%20Killerz,%20Contact%20Form%20Email" target="_top">
                            <strong class="link">
                                info@thekillerz.co.uk
                            </strong>
                        </a>
                    </span>
                </h5>

                <div class="form">
                    <div class="form-row">
                        <div class="form-column">
                            <img src="images/lewis.jpg" style="width: 100%;">
                        </div>
                        <div class="form-column">
                            <form name="contact" action="POST">
                                    <label for="name">NAME</label>
                                    <input type="text" id="name" name="name" placeholder="Type Here" required>

                                    <label for="email">EMAIL</label>
                                    <input type="email" id="email" name="email" placeholder="Type Here" required>

                                    <label for="phone">PHONE - Optional</label>
                                    <input type="tel" id="phone" name="phone" placeholder="Type Here">

                                    <label for="date">GIG DATE - Optional</label>
                                    <input type="date" id="date" name="date" placeholder="Type Here" style="resize: none;">

                                    <label for="message">MESSAGE</label>
                                    <textarea cols="40" rows="5" id="message" name="message" placeholder="Type Here"
                                        style="height: 70px; margin-bottom: 30px;" required>
                                    </textarea>

                                    <input type="text" id="nice-try" name="nice-try" placeholder="Type Here">

                                    <input type="submit" name="submit" class="button" id="submit_btn"
                                    value="Submit">
                            </div>
                        </form>

                    </div>
                </div>
            </div>

            <div id="dialog" hidden>
                <p>Lets have some fun with dialogs!</p>

                <div class="footer">
                    <button id="btn-next">Next</button>
                </div>
            </div>

            <footer>
                <div style="display: flex; justify-content: space-evenly; margin: 30px; margin-left: auto; margin-right: auto; width: 70%;">
                    <a href="https://www.facebook.com/killerstribute/"  target=”_blank”>
                        <i class="fa fa-facebook social-btn" id="social" aria-hidden="true"></i>
                    </a>
                    <a href="https://www.instagram.com/killerstribute/" target="_blank">
                        <i class="fa fa-instagram social-btn" id="social" aria-hidden="true"></i>
                    </a>
                    <a href="https://twitter.com/killerstribute?lang=en" target="_blank">
                        <i class="fa fa-twitter social-btn" id="social" aria-hidden="true"></i>
                    </a>
                    <a href="https://www.youtube.com/channel/UCoEnQkjtg8qYyPMfEy3j0LQ" target="_blank">
                        <i class="fa fa-youtube-play social-btn" id="social" aria-hidden="true"></i>
                    </a>
                </div>
                <div style="display: flex; justify-content:center; padding: 20px;">
                    <img src="images/winner-banner_red.png" width="40%">
                </div>

            </footer>


        </main>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.8.16/jquery-ui.min.js"></script>
    <script src="./lightbox/lightbox-plus-jquery.min.js"></script>
    <script src="main.js"></script>

    </body>
</html>
